[package]
name = "bandwidthx-app"
version = "1.0.0"
description = "BandwidthX — Advanced Windows Network Monitoring and Exclusive Bandwidth Management"
authors = ["BandwidthX Team"]
license = "MIT"
edition = "2021"

[lib]
name = "bandwidthx_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
bandwidthx-common = { path = "../crates/common" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tokio = { version = "1.43", features = ["full"] }
rusqlite = { version = "0.33", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
uuid = { version = "1.13", features = ["v4"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
] }
