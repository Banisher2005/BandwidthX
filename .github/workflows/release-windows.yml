name: Build and publish Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v3.*'
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    name: Build BandwidthX Windows setup
    runs-on: windows-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Build privileged Windows service
        run: cargo build --release -p bandwidthx-service

      - name: Stage service binary for the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/resources | Out-Null
          Copy-Item target/release/bandwidthx-service.exe src-tauri/resources/bandwidthx-service.exe -Force
          $staged = Get-Item src-tauri/resources/bandwidthx-service.exe
          if (!$staged -or $staged.Length -lt 500KB) { throw "The BandwidthX service binary was not staged properly." }
          Write-Host "Staged service binary: $($staged.FullName) ($($staged.Length) bytes)"

      - name: Run automated test suite
        run: cargo test --workspace --exclude bandwidthx-service

      - name: Build NSIS setup executable
        run: npx tauri build --bundles nsis

      - name: Verify installer output & generate checksums
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (!$installer) { throw "Tauri did not produce a Windows setup executable." }
          if ($installer.Length -lt 2MB) { throw "Installer is unexpectedly small: $($installer.Length) bytes" }
          Write-Host "Installer ready: $($installer.FullName) ($($installer.Length) bytes)"
          
          # Compute SHA-256 hash
          $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash
          "$hash  $($installer.Name)" | Out-File -FilePath "$($installer.FullName).sha256" -Encoding ascii
          "$hash  $($installer.Name)" | Out-File -FilePath "target/release/bundle/nsis/SHA256SUMS.txt" -Encoding ascii
          Write-Host "Installer SHA256: $hash"

      - name: Test installation and service registration
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Write-Host "Running silent installation test..."
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 6

          $installedDir = "$env:ProgramFiles\BandwidthX"
          Write-Host "Verifying installation at $installedDir..."
          Get-ChildItem -Path "$installedDir" -Recurse | Select-Object FullName
          if (!(Test-Path "$installedDir\BandwidthX.exe") -and !(Test-Path "$installedDir\bandwidthx-app.exe")) {
            throw "Desktop executable not found in $installedDir"
          }
          if (!(Test-Path "$installedDir\resources\bandwidthx-service.exe")) {
            throw "Service executable not found in $installedDir\resources"
          }
          Write-Host "Installer files verified successfully."

          # Verify service registration in SCM
          $scOutput = sc.exe query BandwidthX
          Write-Host ($scOutput -join "`n")
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Registering service directly to verify binary functionality..."
            & "$installedDir\resources\bandwidthx-service.exe" --install
            $scOutput = sc.exe query BandwidthX
            Write-Host ($scOutput -join "`n")
            if ($LASTEXITCODE -ne 0) {
              throw "BandwidthX service is not registered in SCM."
            }
          }
          Write-Host "Service registration verified."

          # Test uninstallation
          Write-Host "Testing uninstallation..."
          if (Test-Path "$installedDir\uninstall.exe") {
            Start-Process -FilePath "$installedDir\uninstall.exe" -ArgumentList "/S" -Wait
            Start-Sleep -Seconds 6
            sc.exe query BandwidthX
            Write-Host "Uninstallation completed."
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BandwidthX-v3.0.0-Windows-Setup
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*.sha256
            target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          name: BandwidthX 3.0.0 — Windows Release
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*.sha256
            target/release/bundle/nsis/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
